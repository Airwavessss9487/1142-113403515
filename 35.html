<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Object Practice</title>
</head>
<body>
    <div id="output"></div>

    <script>
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        const outputDiv = document.getElementById('output');

        // 1. 列出所有屬性
        let allProperties = Object.keys(Person).join(', ');
        let p1 = document.createElement('p');
        p1.textContent = "所有屬性: " + allProperties;
        outputDiv.appendChild(p1);

        // 2. 刪除 age 屬性
        delete Person.age;

        // 3. 刪除後的物件狀態
        let p2 = document.createElement('p');
        p2.textContent = "刪除 age 後的物件: " + JSON.stringify(Person);
        outputDiv.appendChild(p2);

        // 顯示開發者資訊
        let info = document.createElement('footer');
        info.innerHTML = "<hr><p>姓名：施竑宇<br>學號：113403515</p>";
        document.body.appendChild(info);
    </script>
</body>
</html>
